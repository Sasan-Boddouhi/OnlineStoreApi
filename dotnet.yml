name: .NET Build, Test & Docker Image

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:

  # ─────────────────────────────────────────────
  # Job 1: Build, Test & Collect Coverage
  # ─────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest

    # Redis is required by Integration Tests.
    # Tests connect to localhost:6379.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # ── Checkout ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup .NET ──
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ── NuGet Cache ──
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ── Restore ──
      - name: Restore dependencies
        run: dotnet restore "Online Store Application.sln"

      # ── Build ──
      - name: Build
        run: dotnet build "Online Store Application.sln" --configuration Release --no-restore

      # ── Verify Redis ──
      # Integration tests use localhost:6379.
      # This step explicitly verifies that Redis is reachable
      # before starting the test suite.
      - name: Verify Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools
          redis-cli -h localhost -p 6379 ping

      # ── Tests + Coverage ──
      - name: Run tests with coverage
        run: >
          dotnet test "Online Store Application.sln"
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings

      # ── Upload Coverage XML ──
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: '**/TestResults/**/*.cobertura.xml'
          retention-days: 1


  # ─────────────────────────────────────────────
  # Job 2: Generate HTML Coverage Report
  # ─────────────────────────────────────────────
  coverage-report:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:

      # ── Checkout ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Download Coverage XML ──
      - name: Download coverage XML
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      # ── Install ReportGenerator ──
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      # ── Generate HTML Report ──
      - name: Generate HTML report
        run: >
          reportgenerator
          -reports:"**/*.cobertura.xml"
          -targetdir:"coveragereport"
          -reporttypes:Html
          -verbosity:Warning

      # ── Upload Coverage Report ──
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport


  # ─────────────────────────────────────────────
  # Job 3: Docker Image Build & Push to GHCR
  # ─────────────────────────────────────────────
  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:

      # ── Checkout ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Docker Buildx ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to GitHub Container Registry ──
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build & Push Docker Image ──
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          # Push only for push events.
          # Pull Requests only build the image; they do not publish it.
          push: ${{ github.event_name != 'pull_request' }}

          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

          # GitHub Actions cache for Docker layers
          cache-from: type=gha
          cache-to: type=gha,mode=max