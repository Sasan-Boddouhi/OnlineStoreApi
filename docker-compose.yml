services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: onlinestore-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPass123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - onlinestore-network

  redis:
    image: redis:7-alpine
    container_name: onlinestore-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onlinestore-network

  api:
    image: onlinestore-api:latest
    container_name: onlinestore-api
    depends_on:
      - sqlserver
    environment:

      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:80"
      Swagger__Enabled: "true"

      ConnectionStrings__DefaultConnection: >
        Server=sqlserver;
        Database=ShopDB;
        User Id=sa;
        Password=StrongPass123!;
        TrustServerCertificate=True;

      Jwt__Key: "THIS_IS_A_VERY_SECRET_KEY_CHANGE_IT_123456789"
      Jwt__Issuer: "OnlineStoreApi"
      Jwt__Audience: "OnlineStoreClient"
      Redis__Configuration: "redis:6379"
      Redis__InstanceName: "OnlineStore:"
    ports:
      - "5000:80"

    networks:
      - onlinestore-network


volumes:
  sqlserver_data:
  redisdata:

networks:
  onlinestore-network: