name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - '.vscode/**'
      - '.vs/**'

  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      force_verify_fail:
        description: 'T4-I4: force Verify New Health to fail and test rollback'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ═══════════════════════════════════════════════════════════
  # Job 0: Migration Tests (R46)
  #
  # تست‌های مایگریشن به SQL Server واقعی نیاز دارند. با Testcontainers
  # یک کانتینر SQL Server روی همان runner بالا می‌آید، پس روی ubuntu-latest
  # هم اجرا می‌شوند — پیش‌تر LocalDB می‌خواستند و فقط ویندوز جواب می‌داد،
  # یعنی هیچ CI‌ای هرگز یک مایگریشن واقعی را اجرا نمی‌کرد.
  #
  # ubuntu-latest داکر دارد؛ نیازی به docker/setup-docker-action نیست.
  # فقط روی PR به main اجرا می‌شود تا دقیقهٔ CI هدر نرود.
  # ═══════════════════════════════════════════════════════════
  migration-tests:
    name: Migration Tests (Testcontainers)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore "OnlineStore.Tests.Migrations/OnlineStore.Tests.Migrations.csproj"

      # بدون --filter: تمام تست‌های مایگریشن باید اجرا شوند.
      - name: Run migration tests
        run: >
          dotnet test "OnlineStore.Tests.Migrations/OnlineStore.Tests.Migrations.csproj"
          --configuration Release
          --logger "console;verbosity=normal"

  # ═══════════════════════════════════════════════════════════
  # Job 1: Build, Test & Coverage
  # Runner: GitHub-hosted
  # ═══════════════════════════════════════════════════════════
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore "Online Store Application.sln"

      - name: Build
        run: dotnet build "Online Store Application.sln" --configuration Release --no-restore

      # Phase 9 (R25): تست‌های مایگریشن به SQL Server واقعی (LocalDB) نیاز دارند
      # و روی ubuntu-latest در دسترس نیست. اجرای آن‌ها اینجا فقط یک شکست قرمز
      # بی‌معنی می‌سازد. جدا نگه داشته می‌شوند و در job ویندوزی اجرا می‌شوند.
      - name: Run tests with coverage
        run: >
          dotnet test "Online Store Application.sln"
          --configuration Release
          --no-build
          --filter "Category!=Migration"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: '**/TestResults/**/*.cobertura.xml'
          retention-days: 1


  # ═══════════════════════════════════════════════════════════
  # Job 2: HTML Coverage Report
  # Not on the critical deployment path
  # ═══════════════════════════════════════════════════════════
  coverage-report:
    name: Coverage Report
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage XML
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML report
        run: >
          reportgenerator
          -reports:"**/*.cobertura.xml"
          -targetdir:"coveragereport"
          -reporttypes:Html
          -verbosity:Warning

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport


  # ═══════════════════════════════════════════════════════════
  # Job 3: Docker Build & Push to GHCR
  # Gated by successful tests
  # ═══════════════════════════════════════════════════════════
  docker:
    name: Docker Build & Push
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          # PR: build only
          # main/develop push: build + push
          # workflow_dispatch: build + push
          push: ${{ github.event_name != 'pull_request' }}

          tags: |
            ghcr.io/sasan-boddouhi/onlinestoreapi:latest
            ghcr.io/sasan-boddouhi/onlinestoreapi:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
