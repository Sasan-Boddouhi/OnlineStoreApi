services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    container_name: onlinestore-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      # Batch 52 (OPS-01, N15): بدون MSSQL_PID تصویر با ویرایش Developer بالا می‌آید که مجوز production ندارد.
      # Express برای راه‌اندازی (رایگان، سقف 10 GB برای هر پایگاه داده — اندازه را پایش کنید، docs/runbook.md).
      # با مجوز خریداری‌شده: MSSQL_PID=Standard (یا کلید محصول). هرگز Developer یا Evaluation.
      MSSQL_PID: ${MSSQL_PID:-Express}
      # سقف حافظهٔ خود SQL Server (کمی کمتر از mem_limit تا سیستم‌عامل کانتینر جا داشته باشد).
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-1638}
      # فقط برای HEALTHCHECK و scripts/backup.sh داخل همین کانتینر (sqlcmd رمز را از این متغیر می‌خواند،
      # پس رمز در خط فرمان و فهرست پردازه‌ها دیده نمی‌شود).
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-C", "-b", "-l", "5", "-Q", "SELECT 1", "-o", "/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - onlinestore-network
    restart: unless-stopped
    # SQL Server روی Linux دست‌کم 2 GB حافظه می‌خواهد (OPS-01).
    mem_limit: ${MSSQL_MEM_LIMIT:-2g}

  # Batch 52 (OPS-01): یک‌بار در اولین استقرار و هنگام چرخش رمزها، به‌صورت دستی:
  #   docker compose -f docker-compose.prod.yml --profile setup run --rm db-init
  # پایگاه داده (اگر نباشد)، login برنامه (خواندن/نوشتن/اجرا) و login مایگریشن (db_owner همان پایگاه داده) را
  # می‌سازد یا رمزشان را به‌روز می‌کند. فقط همین سرویس و HEALTHCHECK/پشتیبان‌گیری با sa کار می‌کنند.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    profiles: ["setup"]
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command: ["-S", "sqlserver", "-U", "sa", "-C", "-b", "-i", "/scripts/create-app-login.sql"]
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      # متغیرهای اسکریپت sqlcmd ($(NAME)) از همین متغیرهای محیطی خوانده می‌شوند.
      DB_NAME: ShopDB
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:?MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD is required}
    volumes:
      - ${SQL_SCRIPTS_PATH:-./scripts/sql}:/scripts:ro
    networks:
      - onlinestore-network
    restart: "no"

  # Batch 52 (OPS-02): مایگریشن یک مرحلهٔ جدای استقرار است، نه بخشی از بالا آمدن API.
  # تصویر «<IMAGE_TAG>-migrator» همان commit را دارد (Dockerfile، target=migrator) و با login مایگریشن کار می‌کند.
  # API فقط پس از خروج موفق این سرویس بالا می‌آید؛ مایگریشن ناموفق = API قدیمی می‌ماند.
  migrator:
    image: ghcr.io/sasan-boddouhi/onlinestoreapi:${IMAGE_TAG:?IMAGE_TAG is required}-migrator
    container_name: onlinestore-migrator
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver;
        Database=ShopDB;
        User Id=${MIGRATION_DB_USER:?MIGRATION_DB_USER is required};
        Password=${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD is required};
        TrustServerCertificate=True;
    networks:
      - onlinestore-network
    restart: "no"
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: onlinestore-redis
    # Batch 52 (OPS-08): Redis فقط کش است (داده و output cache)؛ پیش از رسیدن به سقف کانتینر،
    # کلیدهای کم‌استفاده حذف می‌شوند به‌جای اینکه پردازه با OOM کشته شود.
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-96mb}", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onlinestore-network
    restart: unless-stopped
    mem_limit: 128m

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: onlinestore-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=5000
    ports:
      - "127.0.0.1:16686:16686"
    mem_limit: 256m
    networks:
      - onlinestore-network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: onlinestore-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ${OTEL_CONFIG_PATH:-./otel/otel-collector-prod-config.yaml}:/etc/otel-collector-config.yaml:ro
    mem_limit: 256m
    depends_on:
      - jaeger
    networks:
      - onlinestore-network
    restart: unless-stopped

  api:
    image: ghcr.io/sasan-boddouhi/onlinestoreapi:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: onlinestore-api

    # Batch 52 (OPS-08): فقط وقتی SQL Server و Redis سالم‌اند و مایگریشن با موفقیت تمام شده است.
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://0.0.0.0:80"
      Swagger__Enabled: "false"

      # Batch 52 (OPS-01): login برنامه فقط db_datareader/db_datawriter/EXECUTE دارد (scripts/sql/create-app-login.sql)؛
      # دیگر sa نیست. رمز نباید «;» یا «'» داشته باشد (docs/deployment.md).
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver;
        Database=ShopDB;
        User Id=${APP_DB_USER:?APP_DB_USER is required};
        Password=${APP_DB_PASSWORD:?APP_DB_PASSWORD is required};
        TrustServerCertificate=True;

      # Batch 52 (OPS-02): مایگریشن فقط با سرویس migrator؛ API هرگز اسکیمای production را تغییر نمی‌دهد
      # (login برنامه اصلاً مجوز DDL ندارد).
      Database__AutoMigrate: "false"

      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "OnlineStoreApi"
      Jwt__Audience: "OnlineStoreClient"

      # الزامی در Production؛ نبودِ هرکدام راه‌اندازی را متوقف می‌کند (F-01, F-14).
      PaymentGatewaySettings__Provider: "Zarinpal"
      PaymentGatewaySettings__EnableRealGateway: "true"
      PaymentGatewaySettings__MerchantId: ${ZARINPAL_MERCHANT_ID}
      PaymentGatewaySettings__WebhookSecret: ${PAYMENT_WEBHOOK_SECRET}
      PaymentGatewaySettings__CallbackUrl: ${PAYMENT_CALLBACK_URL}
      CorsOrigins__0: ${CORS_ORIGIN_0}

      # Batch 49b: اگر هیچ انبار پلتفرمی (SellerId = null) نباشد، API هنگام راه‌اندازی آن را از این مقادیر می‌سازد؛
      # بدون انبار و بدون این مقادیر، راه‌اندازی در Production متوقف می‌شود (docs/deployment.md §8).
      # پس از ساخته شدن انبار، این مقادیر دیگر خوانده نمی‌شوند (ولی اگر تنظیم شوند باید معتبر باشند).
      PlatformWarehouse__Name: "${PLATFORM_WAREHOUSE_NAME:-انبار مرکزی پلتفرم}"
      PlatformWarehouse__ProvinceName: "${PLATFORM_WAREHOUSE_PROVINCE:-}"
      PlatformWarehouse__CityName: "${PLATFORM_WAREHOUSE_CITY:-}"
      PlatformWarehouse__StreetAddress: "${PLATFORM_WAREHOUSE_STREET_ADDRESS:-}"
      PlatformWarehouse__Plaque: "${PLATFORM_WAREHOUSE_PLAQUE:-}"
      PlatformWarehouse__Unit: "${PLATFORM_WAREHOUSE_UNIT:-}"
      PlatformWarehouse__PostalCode: "${PLATFORM_WAREHOUSE_POSTAL_CODE:-}"
      PlatformWarehouse__RecipientFirstName: "${PLATFORM_WAREHOUSE_RECIPIENT_FIRST_NAME:-}"
      PlatformWarehouse__RecipientLastName: "${PLATFORM_WAREHOUSE_RECIPIENT_LAST_NAME:-}"
      PlatformWarehouse__PhoneNumber: "${PLATFORM_WAREHOUSE_PHONE:-}"

      # Batch 40 (SEC-06): Hostهای مجاز (با «;» جدا). localhost برای HEALTHCHECK کانتینر لازم است.
      # مثال: ALLOWED_HOSTS=api.example.com;localhost . خالی = «*» و یک هشدار در لاگ راه‌اندازی.
      AllowedHosts: "${ALLOWED_HOSTS:-*}"

      # F-20: پروکسی معکوس مورد اعتماد (nginx). فقط X-Forwarded-For از همین آدرس‌ها پذیرفته می‌شود.
      # TRUSTED_PROXY_NETWORK = زیرشبکهٔ شبکهٔ compose به‌صورت CIDR (مثلاً 172.18.0.0/16؛ docs/deployment.md §7)؛
      # یا TRUSTED_PROXY_IP = IP دقیق پروکسی. اگر هر دو خالی بمانند API هشدار می‌دهد و همهٔ کلاینت‌ها
      # IP پروکسی را می‌گیرند (محدودیت نرخ ورود بین همه مشترک می‌شود). هرگز 0.0.0.0/0 ندهید.
      ForwardedHeaders__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-}
      ForwardedHeaders__KnownProxies__0: ${TRUSTED_PROXY_IP:-}
      ForwardedHeaders__ForwardLimit: "1"

      Redis__Configuration: "redis:6379"
      Redis__InstanceName: "OnlineStore:"

      OpenTelemetry__Enabled: "${OTEL_ENABLED:-true}"
      OpenTelemetry__Endpoint: "http://otel-collector:4317"
      OpenTelemetry__TraceSamplingRatio: "0.1"
      OpenTelemetry__ServiceName: "OnlineStoreApi"
      OpenTelemetry__IncludeEfCore: "true"
      OpenTelemetry__IncludeRedis: "true"

      GIT_COMMIT: ${GIT_COMMIT}

    # N19: آپلودها روی volume محلی همین گره؛ scripts/backup.sh از آن پشتیبان می‌گیرد (OPS-05).
    # فقط یک نمونهٔ API (OPS-02: محدودکنندهٔ نرخ، صف کارها و آپلودها هنوز بین نمونه‌ها مشترک نیستند).
    volumes:
      - uploads_data:/app/wwwroot/uploads

    # Batch 52 (OPS-03): فقط روی loopback میزبان؛ TLS و دسترسی عمومی با پروکسی معکوس جلوی آن.
    # اگر پروکسی روی ماشین دیگری است، API_BIND_ADDRESS را به IP شبکهٔ خصوصی بدهید، نه 0.0.0.0.
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:5000:80"
    mem_limit: 512m
    networks:
      - onlinestore-network
    restart: unless-stopped

volumes:
  uploads_data:
    name: onlinestoreapi_uploads_data

  sqlserver_data:
    external: true
    name: onlinestoreapi_sqlserver_data

  redisdata:
    external: true
    name: onlinestoreapi_redisdata

networks:
  onlinestore-network:
    driver: bridge
